<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hugo García Núñez — Credenciales</title>
<style>
  :root {
    --navy: #0E2A4A;
    --bg: #F3F5F8;
    --card: #FFFFFF;
    --muted: #6B7280;
    --line: #DDE1E7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--navy);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 60px 24px;
  }

  main {
    width: 100%;
    max-width: 600px;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 36px;
  }

  h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }

  .cert-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cert-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    text-decoration: none;
    color: inherit;
  }

  .cert-card:hover, .cert-card:focus-visible {
    border-color: var(--navy);
  }

  .cert-name {
    font-weight: 500;
    font-size: 15px;
  }

  .cert-date {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  .cert-action {
    flex-shrink: 0;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  @media (max-width: 460px) {
    .cert-card {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>
</head>
<body>
<main>
  <h1>Hugo García Núñez</h1>

  <h2>Palo Alto Networks</h2>
  <div class="cert-list">
    <a class="cert-card" href="./palo-alto-practitioner.pdf" target="_blank" rel="noopener">
      <div>
        <div class="cert-name">Cybersecurity Practitioner</div>
        <div class="cert-date">Jun 2026</div>
      </div>
      <span class="cert-action">Ver PDF</span>
    </a>

    <a class="cert-card" href="./palo-alto-apprentice.pdf" target="_blank" rel="noopener">
      <div>
        <div class="cert-name">Cybersecurity Apprentice</div>
        <div class="cert-date">Jun 2026</div>
      </div>
      <span class="cert-action">Ver PDF</span>
    </a>
  </div>
</main>
</body>
</html>
